<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nifty 50 Alert System Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
        }
        
        .card h3 {
            color: #4a5568;
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        
        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #48bb78;
            animation: pulse 2s infinite;
        }
        
        .status-indicator.loading {
            background: #ed8936;
        }
        
        .status-indicator.error {
            background: #f56565;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            margin: 5px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .log-container {
            background: #1a202c;
            color: #e2e8f0;
            padding: 20px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            max-height: 300px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.5;
        }
        
        .log-entry {
            margin-bottom: 8px;
            padding: 5px;
            border-left: 3px solid #4a5568;
            padding-left: 10px;
        }
        
        .log-entry.success {
            border-left-color: #48bb78;
        }
        
        .log-entry.error {
            border-left-color: #f56565;
        }
        
        .log-entry.info {
            border-left-color: #4299e1;
        }
        
        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }
        
        .metric {
            text-align: center;
            padding: 15px;
            background: #f7fafc;
            border-radius: 8px;
        }
        
        .metric-value {
            font-size: 2em;
            font-weight: bold;
            color: #4a5568;
        }
        
        .metric-label {
            font-size: 0.9em;
            color: #718096;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Nifty 50 Alert System</h1>
            <p>Real-time market monitoring with 5-EMA breakout alerts</p>
        </div>
        
        <div class="dashboard">
            <div class="card">
                <h3>📊 System Status</h3>
                <div class="status">
                    <div class="status-indicator loading" id="systemStatus"></div>
                    <span id="statusText">Checking status...</span>
                </div>
                <div class="status">
                    <div class="status-indicator loading" id="marketStatus"></div>
                    <span id="marketText">Checking market...</span>
                </div>
                <button class="btn" onclick="checkStatus()">Refresh Status</button>
                <button class="btn" onclick="startMonitoring()">Start Monitoring</button>
            </div>
            
            <div class="card">
                <h3>📈 Metrics</h3>
                <div class="metrics">
                    <div class="metric">
                        <div class="metric-value" id="alertCount">0</div>
                        <div class="metric-label">Alerts Sent</div>
                    </div>
                    <div class="metric">
                        <div class="metric-value" id="candleCount">0</div>
                        <div class="metric-label">Candles Processed</div>
                    </div>
                    <div class="metric">
                        <div class="metric-value" id="uptime">00:00</div>
                        <div class="metric-label">Uptime</div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="card">
            <h3>📝 Activity Log</h3>
            <div class="log-container" id="logContainer">
                <div class="log-entry info">
                    <span>[INFO] Dashboard initialized</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let startTime = new Date();
        
        function addLog(message, type = 'info') {
            const logContainer = document.getElementById('logContainer');
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry ${type}`;
            logEntry.innerHTML = `<span>[${timestamp}] ${message}</span>`;
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }
        
        function updateStatus(elementId, status, text) {
            const indicator = document.getElementById(elementId);
            const textElement = document.getElementById(text);
            
            indicator.className = `status-indicator ${status}`;
            if (textElement) {
                textElement.textContent = text;
            }
        }
        
        async function checkStatus() {
            try {
                addLog('Checking system status...', 'info');
                
                // Check system status
                const statusResponse = await fetch('/.netlify/functions/upstox-api/status');
                const statusData = await statusResponse.json();
                
                if (statusResponse.ok) {
                    updateStatus('systemStatus', 'success');
                    document.getElementById('statusText').textContent = 'System Online';
                    addLog('System status: Online', 'success');
                } else {
                    updateStatus('systemStatus', 'error');
                    document.getElementById('statusText').textContent = 'System Error';
                    addLog('System status: Error', 'error');
                }
                
                // Check market status
                const healthResponse = await fetch('/.netlify/functions/upstox-api/health');
                const healthData = await healthResponse.json();
                
                if (healthResponse.ok) {
                    const marketOpen = healthData.marketStatus === 'open';
                    updateStatus('marketStatus', marketOpen ? 'success' : 'loading');
                    document.getElementById('marketText').textContent = 
                        marketOpen ? 'Market Open' : 'Market Closed';
                    addLog(`Market status: ${healthData.marketStatus}`, 'info');
                } else {
                    updateStatus('marketStatus', 'error');
                    document.getElementById('marketText').textContent = 'Market Status Unknown';
                    addLog('Failed to get market status', 'error');
                }
                
            } catch (error) {
                addLog(`Error checking status: ${error.message}`, 'error');
                updateStatus('systemStatus', 'error');
                updateStatus('marketStatus', 'error');
                document.getElementById('statusText').textContent = 'Connection Error';
                document.getElementById('marketText').textContent = 'Connection Error';
            }
        }
        
        async function startMonitoring() {
            try {
                addLog('Starting monitoring session...', 'info');
                
                const response = await fetch('/.netlify/functions/background-monitor', {
                    method: 'POST'
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    addLog('Monitoring session started successfully', 'success');
                    document.getElementById('alertCount').textContent = 
                        parseInt(document.getElementById('alertCount').textContent) + 1;
                } else {
                    addLog(`Monitoring failed: ${data.message}`, 'error');
                }
                
            } catch (error) {
                addLog(`Error starting monitoring: ${error.message}`, 'error');
            }
        }
        
        function updateUptime() {
            const now = new Date();
            const diff = now - startTime;
            const minutes = Math.floor(diff / 60000);
            const seconds = Math.floor((diff % 60000) / 1000);
            document.getElementById('uptime').textContent = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }
        
        // Initialize dashboard
        checkStatus();
        setInterval(updateUptime, 1000);
        setInterval(checkStatus, 30000); // Check status every 30 seconds
        
        addLog('Dashboard ready - monitoring Nifty 50 alerts', 'success');
    </script>
</body>
</html>
